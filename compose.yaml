
services:
  postgres:
    image: postgres:17-alpine
    container_name: devjobs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devjobs
      POSTGRES_USER: devjobs
      POSTGRES_PASSWORD: devjobs_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devjobs -d devjobs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
